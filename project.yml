name: RetroManette
options:
  bundleIdPrefix: com.retromanette
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 2.0.0

targets:
  RetroManette:
    type: application
    platform: iOS
    sources:
      - path: RetroManette
        excludes:
          - "**/*.md"
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.retromanette.app
        PRODUCT_NAME: RetroManette
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: RetroManette/Emulation/RetroManette-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/libretro"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GCC_C_LANGUAGE_STANDARD: gnu11
        OTHER_LDFLAGS: ["-ObjC", "-lmgba_libretro", "-lz"]
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/Vendor/cores/iphoneos"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/Vendor/cores/iphonesimulator"
    info:
      path: RetroManette/Info.plist
      properties:
        CFBundleDisplayName: Retro Manette
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ar, fr]
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        # AdMob app ID of Retro Manette. Debug builds request Google's sample ad units, see AdsConfig.swift.
        GADApplicationIdentifier: ca-app-pub-2683853184901962~9178048568
        NSUserTrackingUsageDescription: Allowing tracking lets Retro Manette show ads that are more relevant to you, which helps keep the app free. Your games and saves never leave your device.
